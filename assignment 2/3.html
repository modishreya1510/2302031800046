
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Category</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #f5e6e6, #8b3a3a);
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
        }

        .back-button {
            font-size: 24px;
            cursor: pointer;
            position: absolute;
            top: 20px;
            left: 20px;
        }    

        h2 {
            font-size: 22px;
            color: black;
            margin-bottom: 20px;
        }

        .icon {
            margin-right: 10px;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .category {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .cooking { background: #dff6ff; }
        .sports { background: #d3d3d3; }
        .computer { background: #eaf5dc; }
        .art { background: #fddede; }
        .music { background: #eae3ff; }
        .beauty { background: #fddff6; }
    </style>
</head>
<body>
    <div class="container">
        <!-- <div class="back-arrow">&#x21A9;</div> -->
        <div class="back-button" onclick="goBack()">&#x21A9;</div>
        <h2><span class="icon">&#x22EE;</span> Discover cool skills by category</h2>
        <div class="categories">
            <button class="category cooking" onclick="showAlert('Cooking')">&#129368; <a href="4.html">COOKING</a></button>
            
        </div>
    </div>

    <script>
        function goBack() {
            alert('Going back!');
        }

        function showAlert(category) {
            alert('You selected ' + category + '!');
        }
    </script>
</body>
</html>

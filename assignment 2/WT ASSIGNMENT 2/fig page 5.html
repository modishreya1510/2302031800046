<!DOCTYPE html>

        }
        .search-bar {
            width: 50%;
            padding: 1px;
            margin: 20px auto;
            display: flex;

        }
        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: auto;
        }
        .box {
            background: white;
            padding: 10px;

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
     <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f9f9f9;
}

.container {
    position: relative;
    width: 100%;
    max-width: 400px;
    padding: 20px;
}

.back-arrow {
    position: absolute;
    top: 20px;
    left: 20px;
    margin-left:10px;
    margin-top:10px;
    font-size: 24px;
    color: #000000;
    cursor: pointer;
}

.signin-box {
    background: white;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    text-align: center;
}

h2 {
    margin-bottom: 20px;
    color: #A63F3F;
}

.input-box {
    position: relative;
    margin-bottom: 20px;
}

.input-box input {
    width: 100%;
    padding: 10px 40px;
    border: 1px solid #A63F3F;
    border-radius: 5px;
}

.icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
}

.forgot {
    display: block;
    text-align: right;
    color: #A63F3F;
    font-size: 14px;
    margin-bottom: 20px;
}

.login-btn {
    width: 100%;
    padding: 10px;
    background: #A63F3F;
    color: white;
    border: none;
    border-radius: 15px;
    cursor: pointer;
}

     </style>
     <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
    event.preventDefault();
    alert('Login button clicked!');
});

     </script>
</head>
<body>
    <div class="container">
        <div class="back-arrow">&#x21A9;</div>
        <div class="signin-box">
            <h2>SIGN IN</h2>
            <form id="loginForm">
                <div class="input-box">
                    <input type="text" id="username" placeholder="Username" required>
                    <span class="icon">&#128100;</span>
                </div>
                <div class="input-box">
                    <input type="password" id="password" placeholder="Password" required>
                    <span class="icon">&#128274;</span>
                </div>
                <a href="#" class="forgot">Forget Password</a>
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>
</body>
</html>

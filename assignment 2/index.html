    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body {
            background: linear-gradient(to bottom, #FDF2FC, #E5C1CA);

        .search-bar {
            width: 60%;
            padding: 10px;
            border-radius: 20px;

            background: linear-gradient(to bottom,  #D6E7FE, #AABDE8);

        }

        .navbar {
            display: flex;
            justify-content: center;
            gap: 20px;

        }

        .nav-button {
            background: linear-gradient(to bottom,  #D6E7FE, #AABDE8);
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;

        .nav-button:hover {
            background: #D6E7FE, #AABDE8;;
            color: #D6E7FE, #AABDE8;;

        .logo {
